# Official Telegram API through the existing Russia -> Finland CONNECT proxy.
# PostgreSQL and all application data remain local to Hostkey Russia.
services:
  bot:
    environment:
      TELEGRAM_LOCAL_API_URL: ""
      HTTPS_PROXY: http://entry:10089
      NO_PROXY: postgres,localhost,127.0.0.1
    networks: !override
      - gym-bot-network
      - vpn-control

networks:
  telegram-net: !reset null
  vpn-control:
    external: true
    name: vpn-control
